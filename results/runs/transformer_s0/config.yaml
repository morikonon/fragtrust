name: transformer
data:
  dir: data/processed/fft75_4096_s1_v1
model:
  type: transformer
  patch_size: 16
  emb_dim: 32
  d_model: 128
  n_layers: 4
  n_heads: 4
  ff_mult: 4
  dropout: 0.1
train:
  epochs: 30
  batch_size: 512
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 2
  patience: 5
  log_every: 500
